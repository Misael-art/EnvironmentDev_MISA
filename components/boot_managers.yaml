CloverBootManager:
  category: Boot Managers
  dependencies: []
  description: Gerenciador de boot avançado para configurações de multiboot
  install_method: script
  post_install_message: 'Clover Boot Manager foi instalado com sucesso.


    Um backup da partição EFI foi criado em caso de problemas.

    Para acessar o modo de recuperação em caso de problemas, use a opção

    "Recuperar Clover Boot Manager" no menu de ferramentas do Environment Dev.


    Um guia detalhado de recuperação está disponível na documentação.


    Reinicie o computador para usar o Clover para inicialização.

    '
  rollback_actions:
  - module_function: restore_latest_backup
    module_path: env_dev.utils.efi_backup
    type: python_module
  script_actions:
  - args:
    - ${project_root}/env_dev/core/clover_installer.py
    - install_clover
    command: ${python_executable}
    type: executable
  verify_actions:
  - module_function: verify_clover_installation
    module_path: env_dev.utils.clover_verification
    type: python_module
DualBootPartitionManager:
  category: Boot Managers
  description: Utilitario para gerenciar particoes em configuracoes dual boot
  extract_path: ${env:USERPROFILE}\\AppData\\Local\\DualBootPartitionManager
  install_method: script
  post_install_message: 'Utilitário de gerenciamento de partições dual boot instalado
    com sucesso.

    Foi criado um atalho "Assistente Dual Boot" em sua área de trabalho.

    Use-o para preparar seu sistema para configurações de dual boot.

    '
  script_actions:
  - args: []
    command: New-Item -Path '${env:USERPROFILE}\AppData\Local\DualBootPartitionManager'
      -ItemType Directory -Force
    type: powershell
  - args: []
    command: "Write-Host \"Instalando Dual Boot Partition Manager...\"\n$targetDir\
      \ = \"$env:USERPROFILE\\AppData\\Local\\DualBootPartitionManager\"\n\n# Criar\
      \ arquivo de script auxiliar\n$scriptContent = @'\nWrite-Host \"=== Preparação\
      \ para Dual Boot ===\"\nWrite-Host \"Este script ajuda a preparar seu sistema\
      \ para dual boot com Windows e Linux.\"\n\n# Verificar se o sistema está em\
      \ modo UEFI ou Legacy BIOS\n$firmware = Get-ComputerInfo | Select-Object BiosFirmwareType\n\
      Write-Host \"Tipo de firmware: $($firmware.BiosFirmwareType)\"\n\n# Mostrar\
      \ informações sobre discos e partições\nWrite-Host \"`nDiscos disponíveis:\"\
      \nGet-Disk | Format-Table -AutoSize\n\nWrite-Host \"`nPartições existentes:\"\
      \nGet-Partition | Format-Table -AutoSize\n\n# Verificar espaço livre\n$disks\
      \ = Get-Disk | Where-Object { $_.Size -gt 0 }\nforeach ($disk in $disks) {\n\
      \    $usedSpace = (Get-Partition -DiskNumber $disk.Number | Measure-Object -Property\
      \ Size -Sum).Sum\n    $freeSpace = $disk.Size - $usedSpace\n    $freeSpaceGB\
      \ = [math]::Round($freeSpace / 1GB, 2)\n\n    Write-Host \"Disco $($disk.Number):\
      \ $freeSpaceGB GB livres\"\n}\n\nWrite-Host \"`nPressione qualquer tecla para\
      \ continuar...\"\n$null = $Host.UI.RawUI.ReadKey(\"NoEcho,IncludeKeyDown\")\n\
      '@\n\nSet-Content -Path \"$targetDir\\prepare_dualboot.ps1\" -Value $scriptContent\n\
      \n# Criar arquivo batch para facilitar o uso\n$batchContent = @'\n@echo off\n\
      echo Assistente de Dual Boot\necho ====================\necho.\necho 1. Preparar\
      \ sistema para dual boot\necho 2. Abrir gerenciamento de disco\necho 3. Sair\n\
      echo.\nset /p choice=Escolha uma opção:\n\nif \"%choice%\"==\"1\" (\n    powershell\
      \ -ExecutionPolicy Bypass -File \"%~dp0prepare_dualboot.ps1\"\n) else if \"\
      %choice%\"==\"2\" (\n    diskmgmt.msc\n)\n\npause\n'@\n\nSet-Content -Path \"\
      $targetDir\\dualboot.bat\" -Value $batchContent -Encoding ASCII\n\n# Criar atalho\
      \ na área de trabalho\n$WshShell = New-Object -ComObject WScript.Shell\n$Shortcut\
      \ = $WshShell.CreateShortcut(\"$env:USERPROFILE\\Desktop\\Assistente Dual Boot.lnk\"\
      )\n$Shortcut.TargetPath = \"$targetDir\\dualboot.bat\"\n$Shortcut.Save()\n\n\
      Write-Host \"Dual Boot Partition Manager instalado com sucesso.\"\n"
    type: powershell
  verify_actions:
  - path: ${env:USERPROFILE}\\AppData\\Local\\DualBootPartitionManager
    type: directory_exists
Grub2Win:
  category: Boot Managers
  dependencies: []
  description: Gerenciador de boot GRUB2 para Windows
  download_url: https://downloads.sourceforge.net/project/grub2win/grub2win-2.3.0.0.zip
  hash: e9e8990e3a0169505ecc82968b2aee5f70de26050c441b4f9d267123aa0064d2
  hash_algorithm: sha256
  install_args: /VERYSILENT /SUPPRESSMSGBOXES
  install_method: archive
  post_install_message: 'Grub2Win foi instalado com sucesso.

    Você pode configurar as opções de boot executando C:\grub2\grub2win.exe

    '
  verify_actions:
  - path: C:\grub2\grub2win.exe
    type: file_exists
