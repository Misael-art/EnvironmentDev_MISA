BloatyNosy:
  category: System Optimization (Windows)
  dependencies:
  - 7-Zip
  description: Ferramenta para analisar e remover bloatware do Windows 11
  download_url: https://github.com/builtbybel/BloatyNosy/releases/latest/download/BloatyNosy.zip
  extract_path: ${env:ProgramFiles}\BloatyNosy
  hash: afb079b1b556970e841d9b2685793bd553cd8a9666cc87b339b508d816c05a2c
  hash_algorithm: sha256
  install_method: archive
  verify_actions:
  - path: ${env:ProgramFiles}\BloatyNosy\BloatyNosy.exe
    type: file_exists
Optimizer:
  category: System Optimization (Windows)
  description: Utilitário leve para ajustes de privacidade e desempenho do Windows
  download_dir: ${env:USERPROFILE}\Downloads\Optimizer
  download_url: https://github.com/hellzerg/optimizer/releases/latest/download/Optimizer-16.9.exe
  hash: HASH_PENDENTE_VERIFICACAO
  hash_algorithm: sha256
  install_method: download
  verify_actions:
  - path: ${env:USERPROFILE}\Downloads\Optimizer\Optimizer-16.9.exe
    type: file_exists
WinaeroTweaker:
  category: System Optimization (Windows)
  description: Ferramenta para personalizar e ajustar opções ocultas do Windows
  download_url: https://winaero.com/download.php?view.1796
  install_method: none
  post_install_message: Acesse o link de download para baixar o ZIP do WinaeroTweaker
    e extraia-o manualmente.
  verify_actions:
  - path: ${env:ProgramFiles}\WinaeroTweaker\WinaeroTweaker.exe
