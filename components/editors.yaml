Cursor IDE:
  alternative_urls:
  - https://cursor.sh/download
  category: Editors
  description: IDE focado em IA, fork do VSCode
  download_url: https://download.cursor.sh/windows/nsis/x64
  hash: HASH_NEEDS_UPDATE
  hash_algorithm: sha256
  install_args: /S
  install_method: exe
  verify_actions:
  - path: ${env:LOCALAPPDATA}\Programs\Cursor\Cursor.exe
    type: file_exists
Qwen Code:
  category: Editors
  dependencies:
  - Node.js
  description: Ferramenta CLI de workflow de IA otimizada para modelos Qwen3-Coder
  download_url: https://github.com/QwenLM/qwen-code.git
  environment_setup:
    optional_vars:
    - QWEN_SESSION_TOKEN_LIMIT
    required_vars:
    - OPENAI_API_KEY
    - OPENAI_BASE_URL
    - OPENAI_MODEL
  install_method: npm
  notes: 'Qwen Code é uma ferramenta de linha de comando poderosa para workflows de
    IA.

    Recursos principais:

    - Compreensão e edição de código além dos limites de contexto

    - Automação de workflows (PRs, rebases complexos)

    - Parser otimizado para modelos Qwen-Coder

    - Gerenciamento de sessão com controle de tokens

    - Suporte a múltiplos provedores de API

    '
  package_name: '@qwen-code/qwen-code@latest'
  post_install_commands:
  - npm install -g @qwen-code/qwen-code@latest
  verify_actions:
  - name: qwen
    type: command_exists
  - command: qwen --version
    description: Verifica instalação do Qwen Code
    expected_contains: qwen-code
    type: command_output
TRAE AI IDE:
  alternative_urls:
  - https://www.trae.ai/download
  category: Editors
  description: IDE colaborativo com IA integrada - o mundo's melhor IDE para desenvolvimento
    com IA
  download_url: https://www.trae.ai/
  install_method: manual
  notes: 'TRAE é um IDE revolucionário que integra IA em todo o ciclo de desenvolvimento.

    Recursos principais:

    - Modo SOLO: IA autônoma para desenvolvimento completo

    - Modo IDE: Colaboração tradicional com IA

    - Context Engineer integrado

    - Agentes customizáveis

    - Deploy automático

    '
  post_install_message: 'Acesse https://www.trae.ai/ para download e instalação.

    TRAE oferece desenvolvimento colaborativo com IA avançada.

    '
  verify_actions:
  - path: ${env:LOCALAPPDATA}\Programs\TRAE\TRAE.exe
    type: file_exists
  - path: ${env:ProgramFiles}\TRAE\TRAE.exe
    type: file_exists
Vibe Kanban:
  category: Editors
  dependencies:
  - Node.js
  description: Quadro Kanban para gerenciar agentes de codificação IA (Claude Code,
    Gemini CLI, etc.)
  download_url: https://github.com/BloopAI/vibe-kanban.git
  environment_setup:
    optional_vars:
    - GITHUB_CLIENT_ID
    - POSTHOG_API_KEY
    - POSTHOG_API_ENDPOINT
    - BACKEND_PORT
    - FRONTEND_PORT
    - HOST
  install_method: npm
  notes: 'Vibe Kanban otimiza o trabalho com agentes de codificação IA.

    Recursos principais:

    - Alternância fácil entre diferentes agentes de codificação

    - Orquestração de múltiplos agentes em paralelo/sequência

    - Revisão rápida de trabalho e inicialização de servidores dev

    - Rastreamento de status de tarefas dos agentes IA

    - Configuração centralizada de agentes MCP

    '
  package_name: vibe-kanban
  post_install_commands:
  - npx vibe-kanban
  supported_agents:
  - Claude Code
  - Gemini CLI
  - Codex
  - Amp
  - Outros agentes de codificação IA
  verify_actions:
  - name: npx
    type: command_exists
  - command: npx vibe-kanban --version
    description: Verifica instalação do Vibe Kanban
    expected_contains: vibe-kanban
    type: command_output
Visual Studio Code:
  category: Editors
  dependencies: []
  description: IDE leve e poderoso da Microsoft (versão estável)
  download_url: https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user
  hash: e67bc33529fe779c7d27db10fe83e5cad00c3304e380492bd4b9bd8ff6a51df1
  hash_algorithm: sha256
  install_args: /VERYSILENT /MERGETASKS=!runcode
  install_method: exe
