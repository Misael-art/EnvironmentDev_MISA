WinScript:
  alternative_urls:
  - https://winscript.cc/
  category: Editors
  dependencies:
  - Git
  description: Ferramenta open-source para personalização do Windows - debloat, privacidade,
    performance e instalação de apps
  download_url: https://github.com/flick9000/winscript.git
  environment_setup:
    required_permissions:
    - Administrator
  features:
  - Debloat Windows
  - Privacy enhancements
  - Performance optimization
  - Bulk app installation
  - Microsoft Store removal
  - OneDrive removal
  - Edge debloating
  - Telemetry disabling
  install_method: git
  launch_commands:
  - irm "https://winscript.cc/irm" | iex
  - winget install winscript
  license: GPL v3
  notes: 'WinScript é uma ferramenta poderosa e leve para melhorar e personalizar
    sua experiência no Windows.

    Recursos principais:

    🧹 Debloat: Remove bloatware e componentes desnecessários do Windows

    🔒 Privacidade: Desabilita coleta de dados e telemetria

    ⚡ Performance: Otimizações de desempenho e configurações avançadas

    📦 App Installer: Instalação em lote de software essencial via Chocolatey/Winget


    ATENÇÃO: Deve ser executado como Administrador para funcionar corretamente.

    '
  post_install_commands:
  - git clone https://github.com/flick9000/winscript.git
  supported_package_managers:
  - Chocolatey
  - Winget
  verify_actions:
  - path: ${env:USERPROFILE}\winscript
    type: directory_exists
  - path: ${env:USERPROFILE}\winscript\winscript.ps1
    type: file_exists
