Eden Emulator:
  alternative_urls:
  - https://eden-emu.dev/download
  category: Emuladores (Windows)
  description: Emulador moderno e multiplataforma para Sega Dreamcast
  download_url: https://eden-emu.dev/download
  install_method: manual
  notes: 'Eden é um emulador moderno para Sega Dreamcast com foco em precisão e performance.

    Versão atual: v0.0.3-rc1 (137 MB)

    Requisitos: Windows 10/11 (64-bit)

    '
  post_install_message: 'Acesse https://eden-emu.dev/download para baixar a versão
    mais recente do Eden.

    Suporte para Windows 10/11 (64-bit).

    Consulte os guias de instalação no site oficial.

    '
  verify_actions:
  - path: ${env:ProgramFiles}\Eden\Eden.exe
    type: file_exists
  - path: ${env:LOCALAPPDATA}\Eden\Eden.exe
    type: file_exists
Flycast:
  alternative_urls:
  - https://github.com/flyinghead/flycast.git
  - https://github.com/flyinghead/flycast/releases
  build_info:
    automated_tests: Disponível
    builds_page: https://github.com/flyinghead/flycast/actions
    source: https://github.com/flyinghead/flycast.git
  category: Emuladores (Windows)
  dependencies:
  - 7-Zip
  description: Emulador multiplataforma para Sega Dreamcast, Naomi, Naomi 2 e Atomiswave
  download_url: https://github.com/flyinghead/flycast/releases/latest
  extract_path: ${env:ProgramFiles}\Flycast
  hash: eee885f2986282c71c9384753fde7e99b64fa354ef9649298a3d3edabc7ac892
  hash_algorithm: sha256
  install_method: archive
  notes: 'Flycast é um emulador multiplataforma derivado do reicast.

    Suporta: Sega Dreamcast, Naomi, Naomi 2, e Atomiswave.

    Projeto ativo com builds automatizadas disponíveis.

    '
  post_install_message: 'Flycast instalado com sucesso!

    Documentação e configuração disponível em: TheArcadeStriker''s flycast wiki

    Discord: Junte-se ao servidor Discord oficial para suporte

    '
  supported_systems:
  - Sega Dreamcast
  - Naomi
  - Naomi 2
  - Atomiswave
  verify_actions:
  - path: ${env:ProgramFiles}\Flycast\flycast.exe
    type: file_exists
  - path: ${env:ProgramFiles}\Flycast\flycast-win64.exe
    type: file_exists
