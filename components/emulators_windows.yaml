BizHawk:
  category: Emuladores (Windows)
  description: Emulador multi-sistema focado em TAS (Tool-Assisted Speedruns)
  download_url: https://github.com/TASEmulators/BizHawk/releases
  install_method: none
  post_install_message: Acesse https://github.com/TASEmulators/BizHawk/releases para
    baixar o ZIP do BizHawk e extraia-o manualmente. Certifique-se de ter os pré-requisitos
    (.NET Desktop Runtime, VC++ Runtimes) instalados.
  verify_actions:
  - path: ${env:ProgramFiles}\BizHawk\EmuHawk.exe
    type: file_exists
