Cemu (AppImage):
  category: Emulators (Steam Deck)
  description: Emulador de Wii U (via AppImage)
  download_dir: ${env:HOME}/Applications
  download_url: https://github.com/cemu-project/Cemu/releases/download/v2.0-79/Cemu-2.0-79-x86_64.AppImage
  hash: e2ab74b5b0e8b4e6f1a01c72e80ffa577ec65358c9fbe126a3fbfb2d404e06fb
  hash_algorithm: sha256
  install_method: download
  os_filter:
    linux: true
  post_install_message: Cemu AppImage baixado para ~/Applications. Torne-o executável
    (chmod +x) e execute.
  supported_os:
  - linux
  verify_actions:
  - path: ${env:HOME}/Applications/Cemu-2.0-79-x86_64.AppImage
    type: file_exists
Decky Loader:
  category: Customization (Steam Deck)
  description: Plugin loader para adicionar funcionalidades à interface do Steam Deck
  install_method: script
  os_filter:
    linux: true
  post_install_message: Decky Loader instalado. Reinicie o Steam Deck para acessá-lo
    no menu '...'
  script_actions:
  - args:
    - -c
    - curl -L https://github.com/SteamDeckHomebrew/decky-installer/releases/latest/download/install.sh
      | sh
    command: /bin/bash
    type: executable
  supported_os:
  - linux
  verify_actions:
  - path: ${env:HOME}/homebrew/plugins
    type: directory_exists
Dolphin Emulator (Flatpak):
  category: Emulators (Steam Deck)
  description: Emulador de GameCube e Wii (via Flatpak)
  install_method: script
  os_filter:
    linux: true
  script_actions:
  - args:
    - install
    - --user
    - --noninteractive
    - flathub
    - org.DolphinEmu.dolphin-emu
    command: flatpak
    type: executable
  supported_os:
  - linux
  verify_actions:
  - command: flatpak info org.DolphinEmu.dolphin-emu
    expected_contains: 'ID: org.DolphinEmu.dolphin-emu'
    type: command_output
