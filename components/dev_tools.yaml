CMake:
  category: Build Tools
  dependencies: []
  description: Sistema de build multiplataforma
  download_url: https://github.com/Kitware/CMake/releases/download/v3.28.1/cmake-3.28.1-windows-x86_64.msi
  hash: 05f46ef9dd9f8c274d92aabdb0006dc834363f393559ffde1d68d362cb0fc858
  hash_algorithm: sha256
  install_args: /quiet /norestart ADD_CMAKE_TO_PATH=System
  install_method: msi
  verify_actions:
  - path: C:\Program Files\CMake\bin\cmake.exe
    type: file_exists
Clang:
  category: Compilers
  dependencies: []
  description: Compilador Clang/LLVM para Windows
  download_url: https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.6/LLVM-18.1.6-win64.exe
  hash: HASH_PENDENTE_VERIFICACAO
  hash_algorithm: sha256
  install_args: /S
  install_method: exe
  verify_actions:
  - path: C:\Program Files\LLVM\bin\clang.exe
    type: file_exists
Git:
  category: Version Control
  description: Sistema de controle de versão distribuído
  download_url: https://github.com/git-for-windows/git/releases/download/v2.43.0.windows.1/Git-2.43.0-64-bit.exe
  hash: a6058d7c4c16bfa5bcd6fde051a92de8c68535fd7ebade55fc0ab1c41be3c8d5
  hash_algorithm: sha256
  install_args: /VERYSILENT /NORESTART /NOCANCEL /SP- /CLOSEAPPLICATIONS /RESTARTAPPLICATIONS
    /COMPONENTS="icons,ext\reg\shellhere,assoc,assoc_sh"
  install_method: exe
  verify_actions:
  - path: C:\Program Files\Git\bin\git.exe
    type: file_exists
  - name: git
    type: command_exists
Git Bash:
  category: Version Control
  dependencies:
  - Git
  description: Git for Windows - Terminal Bash integrado
  download_url: https://github.com/git-for-windows/git/releases/download/v2.43.0.windows.1/Git-2.43.0-64-bit.exe
  hash: a6058d7c4c16bfa5bcd6fde051a92de8c68535fd7ebade55fc0ab1c41be3c8d5
  hash_algorithm: sha256
  install_args: /VERYSILENT /NORESTART /NOCANCEL /SP- /CLOSEAPPLICATIONS /RESTARTAPPLICATIONS
    /COMPONENTS="icons,ext\reg\shellhere,assoc,assoc_sh"
  install_method: exe
  verify_actions:
  - path: C:\Program Files\Git\git-bash.exe
    type: file_exists
  - path: C:\Program Files\Git\bin\bash.exe
    type: file_exists
  - description: Verifica se bash está disponível no PATH
    name: bash
    type: command_exists
